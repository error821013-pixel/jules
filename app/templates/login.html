{% extends "base.html" %}

{% block title %}Вход - Gaming Club{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-gray-900 p-8 rounded-lg border border-gray-800">
    <h2 class="text-3xl font-black mb-6 text-center uppercase tracking-tighter">Войди на <span class="gaming-accent">Арену</span></h2>

    <div id="db-warning" class="hidden bg-yellow-900 border border-yellow-700 text-yellow-100 px-4 py-2 rounded mb-4 text-[11px] leading-tight">
        <p class="font-bold mb-1">⚠️ ОШИБКА ПОДКЛЮЧЕНИЯ К POSTGRESQL</p>
        <div class="bg-black/30 p-2 rounded mb-1 font-mono text-[10px] break-all" id="db-error-detail"></div>
        <p class="mt-1 italic text-gray-400">Совет: Убедитесь, что пароль '7896' совпадает с тем, что вы ставили при установке Postgres.</p>
        <button onclick="checkDB()" class="mt-2 text-white underline hover:no-underline font-bold text-[10px]">ПОВТОРИТЬ ПРОВЕРКУ</button>
    </div>

    <div id="error" class="hidden bg-red-900 border border-red-700 text-red-100 px-4 py-2 rounded mb-4"></div>

    <form id="loginForm" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-bold text-gray-400 uppercase mb-1">Имя пользователя</label>
            <input type="text" id="username" required class="w-full bg-black border border-gray-700 rounded px-4 py-2 focus:border-red-600 outline-none">
        </div>
        <div>
            <label for="password" class="block text-sm font-bold text-gray-400 uppercase mb-1">Пароль</label>
            <input type="password" id="password" required class="w-full bg-black border border-gray-700 rounded px-4 py-2 focus:border-red-600 outline-none">
        </div>
        <div class="flex space-x-4 pt-4">
            <button type="submit" class="flex-1 btn-primary uppercase tracking-widest">Войти</button>
            <button type="button" id="registerBtn" class="flex-1 border border-red-600 text-red-600 font-bold py-2 rounded hover:bg-red-600 hover:text-white transition uppercase tracking-widest">Регистрация</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function checkDB() {
        try {
            const res = await fetch('/debug-db');
            const data = await res.json();
            if (data.status === 'error') {
                document.getElementById('db-warning').classList.remove('hidden');
                document.getElementById('db-error-detail').textContent = data.detail;
                console.error("Database Error:", data);
            }
        } catch (e) {
            document.getElementById('db-warning').classList.remove('hidden');
            document.getElementById('db-error-detail').textContent = "Не удалось связаться с сервером API";
        }
    }
    checkDB();

    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('error');
    const registerBtn = document.getElementById('registerBtn');

    form.onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('username', document.getElementById('username').value);
        formData.append('password', document.getElementById('password').value);

        const response = await fetch('/token', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            const data = await response.json();
            document.cookie = `access_token=Bearer ${data.access_token}; path=/`;
            window.location.href = '/profile';
        } else {
            const data = await response.json();
            errorDiv.textContent = data.detail || 'Ошибка входа';
            errorDiv.classList.remove('hidden');
        }
    };

    registerBtn.onclick = async () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!username || !password) {
            errorDiv.textContent = 'Пожалуйста, введите имя пользователя и пароль';
            errorDiv.classList.remove('hidden', 'bg-green-900', 'border-green-700', 'text-green-100');
            errorDiv.classList.add('bg-red-900', 'border-red-700', 'text-red-100');
            return;
        }

        const response = await fetch('/users/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            // Auto login after registration
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            const loginRes = await fetch('/token', { method: 'POST', body: formData });
            if (loginRes.ok) {
                const data = await loginRes.json();
                document.cookie = `access_token=Bearer ${data.access_token}; path=/`;
                window.location.href = '/profile';
            } else {
                errorDiv.textContent = 'Регистрация успешна! Теперь вы можете войти.';
                errorDiv.classList.remove('hidden', 'bg-red-900', 'border-red-700', 'text-red-100');
                errorDiv.classList.add('bg-green-900', 'border-green-700', 'text-green-100');
            }
        } else {
            const data = await response.json();
            errorDiv.textContent = data.detail || 'Ошибка регистрации';
            errorDiv.classList.remove('hidden');
        }
    };
</script>
{% endblock %}
